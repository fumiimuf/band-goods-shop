<!DOCTYPE html>
<html
	xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/layout}">
<head>
<meta charset="UTF-8">
<title th:text="#{title.user.edit}"></title>
</head>
<body>
	<main layout:fragment="content">
		<div
			class="container my-4"
			style="max-width: 400px;">
			<!-- 大見出し -->
			<h2
				class="text-center"
				th:text="#{label.user.edit.heading}"></h2>

			<hr class="border-2 opacity-100">

			<div class="card shadow-sm">
				<div class="card-body">
					<!-- 入力フォーム -->
					<form
						th:action="@{/user/update}"
						th:object="${userEditForm}"
						method="post">
						<!-- 氏名 -->
						<div class="mb-3">
							<label
								for="name"
								class="form-label d-flex align-items-center gap-2">
								<span th:text="#{common.label.user.name}"></span>
								<span
									class="badge bg-danger ms-1"
									th:text="#{common.label.required}"></span>
							</label>
							<input
								type="text"
								th:field="*{name}"
								class="form-control"
								th:placeholder="#{placeholder.form.user.name}">
							<div
								class="text-danger"
								th:if="${#fields.hasErrors('name')}"
								th:errors="*{name}"></div>
						</div>
						<!-- メールアドレス -->
						<div class="mb-3">
							<label
								for="email"
								class="form-label d-flex align-items-center gap-2">
								<span th:text="#{common.label.email}"></span>
								<span
									class="badge bg-danger ms-1"
									th:text="#{common.label.required}"></span>
							</label>
							<input
								type="email"
								th:field="*{email}"
								class="form-control"
								th:placeholder="#{placeholder.form.email}">
							<div
								class="text-danger"
								th:if="${#fields.hasErrors('email')}"
								th:errors="*{email}"></div>
						</div>
						<!-- 新しパスワード -->
						<div class="mb-3">
							<label
								for="password"
								class="form-label d-flex align-items-center gap-2">
								<span th:text="#{common.label.new.password}"></span>
							</label>
							<input
								type="password"
								th:field="*{password}"
								class="form-control"
								th:placeholder="#{placeholder.form.password}">
							<div
								class="text-danger"
								th:if="${#fields.hasErrors('password')}"
								th:errors="*{password}"></div>
						</div>
						<!-- 郵便番号 -->
						<div class="mb-3">
							<label
								for="zipCode"
								class="form-label d-flex align-items-center gap-2">
								<span th:text="#{common.label.zip.code}"></span>
								<span
									class="badge bg-danger ms-1"
									th:text="#{common.label.required}"></span>
							</label>
							<input
								type="text"
								th:field="*{zipCode}"
								class="form-control"
								th:placeholder="#{placeholder.form.zip.code}">
							<div
								class="text-danger"
								th:if="${#fields.hasErrors('zipCode')}"
								th:errors="*{zipCode}"></div>
						</div>
						<!-- 住所 -->
						<div class="mb-3">
							<label
								for="address"
								class="form-label d-flex align-items-center gap-2">
								<span th:text="#{common.label.address}"></span>
								<span
									class="badge bg-danger ms-1"
									th:text="#{common.label.required}"></span>
							</label>
							<textarea
								th:field="*{address}"
								class="form-control"
								rows="3"
								th:placeholder="#{placeholder.form.address}"></textarea>
							<div
								class="text-danger"
								th:if="${#fields.hasErrors('address')}"
								th:errors="*{address}"></div>
						</div>
						<div class="d-flex justify-content-center gap-3 mt-4">
							<!-- 戻るボタン -->
							<a
								th:href="@{/user/profile}"
								class="btn btn-outline-secondary px-4"
								th:text="#{btn.back}"></a>
							<!-- 更新ボタン -->
							<button
								type="submit"
								class="btn btn-primary px-4"
								th:text="#{btn.update}"></button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</main>
</body>
</html>
